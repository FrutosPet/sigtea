# T4 (autenticação) preenche este arquivo.
# Rotas: /auth/register, /auth/login, /auth/refresh, /auth/logout e /auth/me
#
# Lembretes para quem implementar:
# - register, login e refresh são públicas: declare `security: []` na operação.
# - register valida se o CPF e o e-mail já existem (409) antes de criar o usuário.
# - A senha vai em texto puro via HTTPS; o hash (bcrypt/argon2) é feito no backend.
# - Login inválido devolve 401 com uma mensagem só ("Credenciais inválidas"),
#   sem dizer se o e-mail existe.
# - Erros seguem o schema Erro e usam códigos do catálogo codigos-erro (T3).

register: {}

login: {}

refresh: {}

logout: {}

me: {}
